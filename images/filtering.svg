<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#ffffff"/>

  <!-- geometry: 0 -> x=110 (t0), each step = 40px, k at step 8 -> x=430, T -> x=610 -->
  <!-- step positions: 110,150,190,230,270,310,350,390,430 (k) -->

  <!-- ============ FILTERING bar: dark 0..k, light k..T ============ -->
  <text x="98" y="88" font-size="17" font-weight="bold" text-anchor="end">Filtering:</text>
  <rect x="110" y="60" width="500" height="46" rx="8" fill="#d9d9d9"/>
  <path d="M118,60 h312 v46 h-312 a8,8 0 0 1 -8,-8 v-30 a8,8 0 0 1 8,-8 z" fill="#2f6fb0"/>

  <!-- ============ Estimate: thick vertical line at k ============ -->
  <line x1="430" y1="52" x2="430" y2="200" stroke="#000000" stroke-width="6"/>

  <!-- ============ time axis ============ -->
  <line x1="110" y1="150" x2="610" y2="150" stroke="#000000" stroke-width="1.5"/>
  <polygon points="610,150 600,145 600,155" fill="#000000"/>

  <!-- tick marks + measurement dots at each time step up to k -->
  <!-- measured steps 0..8 (=k): blue dots -->
  <g>
    <!-- t0 -->
    <line x1="110" y1="146" x2="110" y2="154" stroke="#000" stroke-width="1.5"/>
    <circle cx="110" cy="150" r="5.5" fill="#2f6fb0" stroke="#fff" stroke-width="1.2"/>
    <line x1="150" y1="146" x2="150" y2="154" stroke="#000" stroke-width="1.5"/>
    <circle cx="150" cy="150" r="5.5" fill="#2f6fb0" stroke="#fff" stroke-width="1.2"/>
    <line x1="190" y1="146" x2="190" y2="154" stroke="#000" stroke-width="1.5"/>
    <circle cx="190" cy="150" r="5.5" fill="#2f6fb0" stroke="#fff" stroke-width="1.2"/>
    <line x1="230" y1="146" x2="230" y2="154" stroke="#000" stroke-width="1.5"/>
    <circle cx="230" cy="150" r="5.5" fill="#2f6fb0" stroke="#fff" stroke-width="1.2"/>
    <line x1="270" y1="146" x2="270" y2="154" stroke="#000" stroke-width="1.5"/>
    <circle cx="270" cy="150" r="5.5" fill="#2f6fb0" stroke="#fff" stroke-width="1.2"/>
    <line x1="310" y1="146" x2="310" y2="154" stroke="#000" stroke-width="1.5"/>
    <circle cx="310" cy="150" r="5.5" fill="#2f6fb0" stroke="#fff" stroke-width="1.2"/>
    <line x1="350" y1="146" x2="350" y2="154" stroke="#000" stroke-width="1.5"/>
    <circle cx="350" cy="150" r="5.5" fill="#2f6fb0" stroke="#fff" stroke-width="1.2"/>
    <line x1="390" y1="146" x2="390" y2="154" stroke="#000" stroke-width="1.5"/>
    <circle cx="390" cy="150" r="5.5" fill="#2f6fb0" stroke="#fff" stroke-width="1.2"/>
    <!-- k : last measurement, aligned with estimate line -->
    <circle cx="430" cy="150" r="6.5" fill="#2f6fb0" stroke="#000" stroke-width="1.6"/>
  </g>

  <!-- future steps k+1..T: open (no measurement) ticks -->
  <g stroke="#000" stroke-width="1.5">
    <line x1="470" y1="146" x2="470" y2="154"/>
    <line x1="510" y1="146" x2="510" y2="154"/>
    <line x1="550" y1="146" x2="550" y2="154"/>
    <line x1="590" y1="146" x2="590" y2="154"/>
  </g>
  <g fill="none" stroke="#9aa0a6" stroke-width="1.4">
    <circle cx="470" cy="150" r="5"/>
    <circle cx="510" cy="150" r="5"/>
    <circle cx="550" cy="150" r="5"/>
    <circle cx="590" cy="150" r="5"/>
  </g>

  <!-- axis labels: 0, k, k+1 (present), T -->
  <text x="110" y="176" font-size="15" text-anchor="middle">0</text>
  <text x="390" y="176" font-size="15" font-weight="bold" text-anchor="middle">k</text>
  <text x="430" y="176" font-size="15" font-weight="bold" text-anchor="middle" fill="#000" stroke="#fff" stroke-width="3.5" paint-order="stroke">k+1</text>
  <text x="610" y="176" font-size="15" font-weight="bold" text-anchor="middle">T</text>
  <text x="360" y="128" font-size="13" fill="#5f6368" text-anchor="middle" font-style="italic">time</text>

  <!-- ============ bottom labels + arrows ============ -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 z" fill="#000000"/>
    </marker>
  </defs>

  <text x="200" y="250" font-size="16" text-anchor="middle">Measurements</text>
  <line x1="200" y1="236" x2="250" y2="162" stroke="#000" stroke-width="1.6" marker-end="url(#arrow)"/>

  <text x="470" y="250" font-size="16" text-anchor="middle">Estimate</text>
  <line x1="452" y1="236" x2="433" y2="200" stroke="#000" stroke-width="1.6" marker-end="url(#arrow)"/>
</svg>
