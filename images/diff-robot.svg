<svg width="320" height="300" viewBox="0 0 320 300" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Arrowhead for axes and angle arc -->
        <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#222" />
        </marker>
        <!-- Smaller arrowhead for dimension lines -->
        <marker id="dim-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#444" />
        </marker>
    </defs>

    <!-- Global Coordinate System Axes -->
    <line x1="40" y1="260" x2="280" y2="260" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)" />
    <line x1="40" y1="260" x2="40" y2="30" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)" />
    
    <!-- Axes Labels -->
    <text x="290" y="265" font-family="serif" font-size="16" fill="#222">x</text>
    <text x="40" y="20" font-family="serif" font-size="16" fill="#222" text-anchor="middle">y</text>

    <!-- Differential Drive Robot -->
    <g transform="translate(120, 200) rotate(-50)">
        <!-- Robot Chassis (Pentagon shape) -->
        <polygon points="-30,-25 15,-25 35,0 15,25 -30,25" fill="none" stroke="#222" stroke-width="2.5" stroke-linejoin="round" />
        
        <!-- Axle -->
        <line x1="0" y1="-25" x2="0" y2="25" stroke="#222" stroke-width="1.5" />
        
        <!-- Wheels -->
        <line x1="-15" y1="-25" x2="15" y2="-25" stroke="#222" stroke-width="4" />
        <line x1="-15" y1="25" x2="15" y2="25" stroke="#222" stroke-width="4" />
        
        <!-- Center Origin Point -->
        <circle cx="0" cy="0" r="4" fill="#222" />
        
        <!-- Forward Heading Line (Internal to robot frame) -->
        <line x1="0" y1="0" x2="70" y2="0" stroke="#222" stroke-width="1" stroke-dasharray="6,5" />

        <!-- Dimension 'l' (Distance from rear edge to axle) -->
        <!-- Extension lines -->
        <line x1="-30" y1="-28" x2="-30" y2="-45" stroke="#444" stroke-width="1" />
        <line x1="0" y1="-28" x2="0" y2="-45" stroke="#444" stroke-width="1" />
        <!-- Dimension line with arrows -->
        <line x1="-30" y1="-40" x2="0" y2="-40" stroke="#444" stroke-width="1.2" marker-start="url(#dim-arrow)" marker-end="url(#dim-arrow)" />

        <!-- Dimension '2r' (Wheel diameter) -->
        <!-- Extension lines -->
        <line x1="-15" y1="28" x2="-15" y2="45" stroke="#444" stroke-width="1" />
        <line x1="15" y1="28" x2="15" y2="45" stroke="#444" stroke-width="1" />
        <!-- Dimension line with arrows -->
        <line x1="-15" y1="40" x2="15" y2="40" stroke="#444" stroke-width="1.2" marker-start="url(#dim-arrow)" marker-end="url(#dim-arrow)" />
    </g>

    <!-- Robot Center Coordinates Label -->
    <text x="120" y="222" font-family="serif" font-size="14" fill="#222" text-anchor="middle">(x,y)</text>
    
    <!-- Dimension Text Labels (Absolute positioning to keep text upright) -->
    <text x="74" y="183" font-family="serif" font-style="italic" font-size="14" fill="#222" text-anchor="middle">l</text>
    <text x="160" y="242" font-family="serif" font-style="italic" font-size="14" fill="#222" text-anchor="middle">2r</text>

    <!-- Angle theta (Heading orientation) -->
    <!-- Horizontal reference dashed line starting from intersection point -->
    <line x1="149" y1="166" x2="225" y2="166" stroke="#222" stroke-width="1" stroke-dasharray="6,5" />
    
    <!-- Arc for angle theta (Radius 35) -->
    <path d="M 184 166 A 35 35 0 0 0 171.4 139.2" fill="none" stroke="#222" stroke-width="1.2" marker-end="url(#arrow)" />
    
    <!-- Theta Greek letter label -->
    <text x="189" y="152" font-family="serif" font-style="italic" font-size="16" fill="#222">θ</text>
</svg>
