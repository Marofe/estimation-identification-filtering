<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="100%" height="100%" style="background-color: #fafbfd; font-family: -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, &#39;Helvetica Neue&#39;, Arial, sans-serif;">
  <defs>
    <!-- Sombra suave para acabamento visual refinado -->
    <filter id="soft-shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e293b" flood-opacity="0.06" />
    </filter>

    <!-- Superficie da Variedade M -->
    <linearGradient id="manifold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Marcadores de Flechas das Cartas -->
    <marker id="arr-phi" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155" />
    </marker>

    <!-- Marcadores de Flechas de Transicao -->
    <marker id="arr-trans-fwd" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3b82f6" />
    </marker>
    <marker id="arr-trans-bwd" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f43f5e" />
    </marker>

    <!-- Recortes para as intersecoes no Manifold M -->
    <clipPath id="clip-u1">
      <path d="M 200,105 C 260,80 330,85 350,125 C 360,160 310,185 250,170 C 190,155 180,125 200,105 Z" />
    </clipPath>
    <clipPath id="clip-u2">
      <path d="M 320,95 C 390,70 470,75 500,120 C 510,160 450,190 385,180 C 325,165 300,130 320,95 Z" />
    </clipPath>
  </defs>

  <!-- 1. TOPO: VARIEDADE M E CONJUNTOS ABERTOS -->
  <!-- Superficie M -->
  <path d="M 110,180 C 180,75 290,40 440,50 C 590,60 690,90 770,55 C 730,130 745,190 725,220 C 580,260 330,245 110,180 Z" fill="url(#manifold-grad)" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" filter="url(#soft-shadow)" />

  <!-- U1: Azul Céu Pastel -->
  <path d="M 200,105 C 260,80 330,85 350,125 C 360,160 310,185 250,170 C 190,155 180,125 200,105 Z" fill="#38bdf8" fill-opacity="0.22" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="5 3.5" />

  <!-- U2: Âmbar/Dourado Suave -->
  <path d="M 320,95 C 390,70 470,75 500,120 C 510,160 450,190 385,180 C 325,165 300,130 320,95 Z" fill="#f59e0b" fill-opacity="0.20" stroke="#d97706" stroke-width="1.8" stroke-dasharray="5 3.5" />

  <!-- U1 cap U2: Salvia / Esmeralda Mudo -->
  <path d="M 320,95 C 390,70 470,75 500,120 C 510,160 450,190 385,180 C 325,165 300,130 320,95 Z" clip-path="url(#clip-u1)" fill="#10b981" fill-opacity="0.45" stroke="#059669" stroke-width="1" />

  <!-- U3: Lavanda / Indigo Suave -->
  <path d="M 470,105 C 530,80 610,85 630,125 C 645,165 590,195 530,185 C 465,175 445,140 470,105 Z" fill="#818cf8" fill-opacity="0.22" stroke="#6366f1" stroke-width="1.8" stroke-dasharray="5 3.5" />

  <!-- U2 cap U3: Pêssego / Coral Suave -->
  <path d="M 470,105 C 530,80 610,85 630,125 C 645,165 590,195 530,185 C 465,175 445,140 470,105 Z" clip-path="url(#clip-u2)" fill="#fb7185" fill-opacity="0.45" stroke="#e11d48" stroke-width="1" />

  <!-- Rotulos no Manifold -->
  <text x="720" y="100" font-size="28" font-style="italic" fill="#1e293b" font-weight="600">M</text>
  <text x="225" y="125" font-size="19" font-style="italic" fill="#0369a1" font-weight="600">U₁</text>
  <text x="405" y="115" font-size="19" font-style="italic" fill="#b45309" font-weight="600">U₂</text>
  <text x="570" y="120" font-size="19" font-style="italic" fill="#4338ca" font-weight="600">U₃</text>
  <text x="660" y="155" font-size="22" fill="#94a3b8" font-weight="bold">⋯</text>

  <!-- 2. FLECHAS DAS CARTAS (phi_1, phi_2, phi_3) -->
  <!-- phi_1 -->
  <path d="M 235,165 Q 165,220 145,340" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr-phi)" />
  <rect x="145" y="235" width="46" height="28" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
  <text x="168" y="254" text-anchor="middle" font-size="16" font-style="italic" fill="#0f172a" font-weight="600">ϕ₁</text>

  <!-- phi_2 -->
  <path d="M 405,175 Q 425,235 430,340" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr-phi)" />
  <rect x="425" y="235" width="46" height="28" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
  <text x="448" y="254" text-anchor="middle" font-size="16" font-style="italic" fill="#0f172a" font-weight="600">ϕ₂</text>

  <!-- phi_3 -->
  <path d="M 570,165 Q 660,220 715,340" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr-phi)" />
  <rect x="665" y="235" width="46" height="28" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
  <text x="688" y="254" text-anchor="middle" font-size="16" font-style="italic" fill="#0f172a" font-weight="600">ϕ₃</text>

  <!-- 3. PLANOS EUCLIDIANOS R^m -->
  <!-- Plano 1 (U1 -> phi1) -->
  <g id="chart-1">
    <polygon points="70,330 270,330 200,435 20,435" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4" filter="url(#soft-shadow)" />
    <ellipse cx="140" cy="380" rx="46" ry="24" fill="#38bdf8" fill-opacity="0.22" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4 3" />
    <ellipse cx="165" cy="378" rx="16" ry="16" fill="#10b981" fill-opacity="0.5" stroke="#059669" stroke-width="1" />
    <text x="235" y="355" font-size="16" font-style="italic" fill="#64748b" font-weight="bold">ℝᵐ</text>
    <text x="120" y="385" font-size="14" font-style="italic" fill="#0369a1" font-weight="600">ϕ₁(U₁)</text>
  </g>

  <!-- Plano 2 (U2 -> phi2) -->
  <g id="chart-2">
    <polygon points="355,330 555,330 485,435 305,435" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4" filter="url(#soft-shadow)" />
    <ellipse cx="425" cy="380" rx="48" ry="24" fill="#f59e0b" fill-opacity="0.20" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3" />
    <!-- Intersecao com U1 (Esmeralda) -->
    <ellipse cx="400" cy="380" rx="16" ry="16" fill="#10b981" fill-opacity="0.5" stroke="#059669" stroke-width="1" />
    <!-- Intersecao com U3 (Pêssego) -->
    <ellipse cx="450" cy="380" rx="16" ry="16" fill="#fb7185" fill-opacity="0.5" stroke="#e11d48" stroke-width="1" />
    <text x="520" y="355" font-size="16" font-style="italic" fill="#64748b" font-weight="bold">ℝᵐ</text>
    <text x="425" y="415" text-anchor="middle" font-size="14" font-style="italic" fill="#b45309" font-weight="600">ϕ₂(U₂)</text>
  </g>

  <!-- Plano 3 (U3 -> phi3) -->
  <g id="chart-3">
    <polygon points="640,330 840,330 770,435 590,435" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4" filter="url(#soft-shadow)" />
    <ellipse cx="710" cy="380" rx="46" ry="24" fill="#818cf8" fill-opacity="0.22" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 3" />
    <ellipse cx="685" cy="380" rx="16" ry="16" fill="#fb7185" fill-opacity="0.5" stroke="#e11d48" stroke-width="1" />
    <text x="805" y="355" font-size="16" font-style="italic" fill="#64748b" font-weight="bold">ℝᵐ</text>
    <text x="730" y="385" font-size="14" font-style="italic" fill="#4338ca" font-weight="600">ϕ₃(U₃)</text>
  </g>

  <!-- 4. MAPAS DE TRANSICAO (PALETA EM PARES HARMONIOSOS) -->

  <!-- ENTRE CARTA 1 E CARTA 2 -->
  <!-- Ida: phi_2 o phi_1^-1 (Azul Real) -->
  <path d="M 175,395 C 230,465 330,465 390,395" fill="none" stroke="#3b82f6" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arr-trans-fwd)" />
  <rect x="235" y="445" width="95" height="24" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
  <text x="282" y="461" text-anchor="middle" font-size="12" font-style="italic" fill="#1d4ed8" font-weight="600">ϕ₂ ∘ ϕ₁⁻¹</text>

  <!-- Volta: phi_1 o phi_2^-1 (Coral Elegante) -->
  <path d="M 385,410 C 335,535 220,535 165,415" fill="none" stroke="#f43f5e" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arr-trans-bwd)" />
  <rect x="228" y="520" width="95" height="24" rx="4" fill="#fff1f2" stroke="#fecdd3" stroke-width="1" />
  <text x="275" y="536" text-anchor="middle" font-size="12" font-style="italic" fill="#be123c" font-weight="600">ϕ₁ ∘ ϕ₂⁻¹</text>

  <!-- ENTRE CARTA 2 E CARTA 3 -->
  <!-- Ida: phi_3 o phi_2^-1 (Azul Real) -->
  <path d="M 460,395 C 515,465 615,465 675,395" fill="none" stroke="#3b82f6" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arr-trans-fwd)" />
  <rect x="520" y="445" width="95" height="24" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
  <text x="567" y="461" text-anchor="middle" font-size="12" font-style="italic" fill="#1d4ed8" font-weight="600">ϕ₃ ∘ ϕ₂⁻¹</text>

  <!-- Volta: phi_2 o phi_3^-1 (Coral Elegante) -->
  <path d="M 670,410 C 620,535 505,535 450,415" fill="none" stroke="#f43f5e" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arr-trans-bwd)" />
  <rect x="512" y="520" width="95" height="24" rx="4" fill="#fff1f2" stroke="#fecdd3" stroke-width="1" />
  <text x="559" y="536" text-anchor="middle" font-size="12" font-style="italic" fill="#be123c" font-weight="600">ϕ₂ ∘ ϕ₃⁻¹</text>
</svg>