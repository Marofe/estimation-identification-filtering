<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="Helvetica, Arial, sans-serif">
  <!-- background -->
  <rect width="640" height="360" fill="#ffffff"/>

  <!-- geometry -->
  <!-- x: 0 -> 110, T -> 610, k -> 430 -->
  <!-- bar height 46, radius 8 -->

  <!-- top axis labels -->
  <text x="110" y="34" font-size="18" font-weight="bold" text-anchor="middle">0</text>
  <text x="430" y="34" font-size="18" font-weight="bold" text-anchor="middle">k</text>
  <text x="610" y="34" font-size="18" font-weight="bold" text-anchor="middle">T</text>

  <!-- ============ PREDICTION (dark 0..before k, light after) ============ -->
  <text x="98" y="80" font-size="17" font-weight="bold" text-anchor="end">Prediction:</text>
  <!-- full light bar -->
  <rect x="110" y="52" width="500" height="46" rx="8" fill="#d9d9d9"/>
  <!-- dark measured portion up to ~ before k -->
  <path d="M118,52 h222 v46 h-222 a8,8 0 0 1 -8,-8 v-30 a8,8 0 0 1 8,-8 z" fill="#2f6fb0"/>

  <!-- ============ FILTERING (dark 0..k, light k..T) ============ -->
  <text x="98" y="158" font-size="17" font-weight="bold" text-anchor="end">Filtering:</text>
  <rect x="110" y="130" width="500" height="46" rx="8" fill="#d9d9d9"/>
  <path d="M118,130 h312 v46 h-312 a8,8 0 0 1 -8,-8 v-30 a8,8 0 0 1 8,-8 z" fill="#2f6fb0"/>

  <!-- ============ SMOOTHING (dark 0..T) ============ -->
  <text x="98" y="236" font-size="17" font-weight="bold" text-anchor="end">Smoothing:</text>
  <rect x="110" y="208" width="500" height="46" rx="8" fill="#2f6fb0"/>

  <!-- ============ Estimate: thick vertical line at k ============ -->
  <line x1="430" y1="44" x2="430" y2="278" stroke="#000000" stroke-width="6"/>

  <!-- ============ labels bottom ============ -->
  <text x="170" y="320" font-size="17" text-anchor="middle">Measurements</text>
  <text x="470" y="320" font-size="17" text-anchor="middle">Estimate</text>

  <!-- arrows from "Measurements" to dark regions -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 z" fill="#000000"/>
    </marker>
  </defs>
  <line x1="185" y1="305" x2="255" y2="105" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="200" y1="305" x2="270" y2="182" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- arrow from Estimate up to the vertical line -->
  <line x1="455" y1="305" x2="433" y2="270" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow)"/>
</svg>
